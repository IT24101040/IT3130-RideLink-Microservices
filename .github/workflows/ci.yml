name: RideLink CI

# Runs on pull requests targeting main, per the group's agreed CI trigger policy.
# Each of the four microservices is built and tested independently in a matrix,
# so one service's failure/absence does not block visibility into the others.
on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-management-service
          - fare-payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check service directory exists
        id: check
        run: |
          if [ -d "${{ matrix.service }}" ] && [ -f "${{ matrix.service }}/pom.xml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.service }}/pom.xml not found — skipping this leg."
          fi

      - name: Build with Maven
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.service }}
        run: mvn -B clean compile

      - name: Run tests with Maven
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.service }}
        run: mvn -B test

      - name: Upload test reports
        if: steps.check.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore
