spring.application.name=ride-management-service

# --- Server ---
server.port=${PORT:8083}

# --- Database (one Mongo DB owned only by this service) ---
spring.data.mongodb.uri=${DATABASE_URL:mongodb://localhost:27017/ridelink_ride_db}

# --- Security / JWT (shared secret agreed across all 4 services) ---
jwt.secret=${JWT_SECRET:local-dev-shared-secret-change-me}

# --- Other services this service calls (interservice communication) ---
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:8082}
fare.service.url=${FARE_SERVICE_URL:http://localhost:8084}

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator health check (agreed convention) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
