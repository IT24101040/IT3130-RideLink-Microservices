spring:
  application:
    name: driver-vehicle-service
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${DATABASE_URL:mongodb://localhost:27017/ridelink_driver_db}
      database: ridelink_driver_db
      auto-index-creation: true

server:
  port: ${PORT:8082}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
